<div style="background: #333; padding: 30px; border-radius: 10px; color: white; width: 400px;">
    <h2>创建房间</h2>
    <input type="text" id="roomName" placeholder="房间名称"
        style="width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; background: #555; color: white;">
    <input type="number" id="maxPlayers" placeholder="最大玩家数" min="2" max="16" value="8"
        style="width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; background: #555; color: white;">
    <input type="password" id="roomPassword" placeholder="房间密码(可选)"
        style="width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; background: #555; color: white;">
    <div style="margin-top: 20px;">
        <button onclick="window.ui.createRoom()"
            style="padding: 10px 20px; margin-right: 10px; background: #ff4444; color: white; border: none; border-radius: 5px; cursor: pointer;">创建</button>
        <button onclick="window.ui.closeModal()"
            style="padding: 10px 20px; background: #666; color: white; border: none; border-radius: 5px; cursor: pointer;">取消</button>
    </div>
</div>
