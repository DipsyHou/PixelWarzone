<div style="background: #333; padding: 30px; border-radius: 10px; color: white; width: 400px;">
    <h2>Create Room</h2>
    <input type="text" id="roomName" placeholder="Room Name"
        style="width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; background: #555; color: white;">
    <input type="number" id="maxPlayers" placeholder="Max Players" min="2" max="16" value="8"
        style="width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; background: #555; color: white;">
    <input type="password" id="roomPassword" placeholder="Password (Optional)"
        style="width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; background: #555; color: white;">
    <div style="margin-top: 20px;">
        <button onclick="window.ui.createRoom()"
            style="padding: 10px 20px; margin-right: 10px; background: #ff4444; color: white; border: none; border-radius: 5px; cursor: pointer;">Create</button>
        <button onclick="window.ui.closeModal()"
            style="padding: 10px 20px; background: #666; color: white; border: none; border-radius: 5px; cursor: pointer;">Cancel</button>
    </div>
</div>
